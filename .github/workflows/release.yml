name: Release .deb Package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Versión del paquete (ej. 1.1.0)"
        required: false
        default: "1.1.0"

permissions:
  contents: write

jobs:
  build-and-release:
    name: Compilar y publicar instalador .deb (amd64)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias de construcción y verificación
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -e ".[dev]" pyinstaller

      - name: Ejecutar linter (Ruff) y suite de pruebas (Pytest)
        run: |
          .venv/bin/ruff check src tests tools
          .venv/bin/pytest -v

      - name: Determinar versión del Release
        id: meta
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VER="${GITHUB_REF#refs/tags/v}"
          else
            VER="${{ github.event.inputs.version || '1.1.0' }}"
          fi
          echo "version=${VER}" >> "$GITHUB_OUTPUT"

      - name: Construir paquete autónomo .deb
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          chmod +x packaging/build_deb.sh
          ./packaging/build_deb.sh

      - name: Publicar en GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "El Arriero MCP v${{ steps.meta.outputs.version }}"
          generate_release_notes: true
          files: |
            dist/el-arriero-mcp_${{ steps.meta.outputs.version }}_amd64.deb
            pt-mcp-bridge.pta
